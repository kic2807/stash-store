version: "3.7"

services:

  app_proxy:
    environment:
      # The format here is: <app-id>_<docker-service-name>_1
      APP_HOST: stash-hello-world_server_1
      APP_PORT: 3000
    
  server:
    image: getumbrel/community-app-store-hello-world:latest
    user: "1000:1000"
    init: true
    # Secrets/infra values live outside the repo in the app data folder.
    # required: false lets the app start before the user creates the file.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
