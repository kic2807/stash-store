version: "3.7"

# SideImpactor: browser-based IPA signing and install over WebUSB. Two parts:
#   web   upstream's frontend, built here from upstream main (nginx, port 3000)
#   wisp  relay at /wisp/ that the page uses to reach Apple's servers
#         (ghcr.io/kic2807/wisp-relay, built in this repo, Apple hosts only)
# Both must be served on one HTTPS origin (WebUSB needs a secure context):
# things-caddy routes sideload.<domain>/wisp/* to `wisp` and the rest to `web`.
# No app_proxy (plain HTTP would not work); the manifest port is a placeholder.

services:
  web:
    # Built in this repo from upstream main (.github/workflows/build-sideimpactor.yml):
    # upstream's own image stopped at 2026-04-13. Includes the nginx MIME fix
    # for lbr77/SideImpactor#3.
    image: ghcr.io/kic2807/sideimpactor:2026.0729.0513-168eb2b@sha256:49aaf742c154736fbd35fe63cfff38b627e29586f1b527373eb2f80589b68ae8
    restart: on-failure

  wisp:
    image: ghcr.io/kic2807/wisp-relay:0.5.0-r1@sha256:2da776e1b9aed9ee5668eae3c5fcf12e1f87107e80ac4fb4fbda902ca67f317b
    restart: on-failure
    read_only: true
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
