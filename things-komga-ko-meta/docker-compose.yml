version: "3.7"

# Add-on for things-komga: fills Komga with Korean metadata (Korean title,
# synopsis, authors, characters) and artwork (Korean edition cover, textless
# wide and square art). Talks to things-komga_server_1 over Umbrel's app
# network and writes through Komga's REST API.
#
# No web UI, so there is no app_proxy; the manifest port is a placeholder.
# Progress goes to the log: sudo docker logs -f things-komga-ko-meta_meta_1

services:
  meta:
    # Released by hand from github.com/kic2807/komga-ko-meta (tag vX.Y.Z).
    image: ghcr.io/kic2807/komga-ko-meta:0.1.2@sha256:640f06a3ab7df7ce5e6dfe37b7c4a86da0a987780914296d5391697dc0f7d14d
    restart: on-failure
    user: "1000:1000"
    read_only: true
    cap_drop:
      - all
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      KOMGA_URL: http://things-komga_server_1:25600
      TZ: Asia/Seoul
    # KOMGA_API_KEY (required), TMDB_API_KEY and KOMGA_KO_META_FLAGS come from
    # the app data .env file; see .env.example.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      # state.json: which series are done, so restarts don't redo the library.
      - ${APP_DATA_DIR}/data:/data
