manifestVersion: 1
id: things-komga-ko-meta
category: media
name: Komga Korean Metadata
version: "0.1.1"
tagline: Korean titles, synopses, characters and artwork for Komga
icon: https://raw.githubusercontent.com/kic2807/things-store/main/things-komga-ko-meta/icon.png
description: >-
  Background add-on for Komga with no web UI. Opening it from the home screen does nothing; check its log.


  For every series in Komga it fills in Korean metadata and artwork: the Korean title, synopsis, publisher, genres, authors and status from the Korean edition (Ridibooks), character names as used in the Korean edition (Wikidata, AniList), the Korean edition cover, and textless wide and square key art (Kitsu, AniList, optionally TMDB). It only fills empty fields and never changes locked ones. New series are picked up as soon as Komga adds them.


  Before starting, create the .env file with a Komga admin API key in the app data folder (see the store README), then restart the app.
releaseNotes: >-
  Fixes "Komga not reachable ... 400": Komga rejected the container name as Host header. No other changes.

