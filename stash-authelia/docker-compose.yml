version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: stash-authelia_server_1
      APP_PORT: 9091
      # Authelia is the login portal itself and is reached through Caddy
      # (stash-caddy) at auth.<domain>. Umbrel login in front of it would mean logging
      # in twice (and would break forward auth for other apps).
      PROXY_AUTH_ADD: "false"

  server:
    image: authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
    restart: on-failure
    environment:
      # The entrypoint drops to this user and chowns /config.
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul
      X_AUTHELIA_CONFIG: /config/configuration.yml
      # Lets configuration.yml read the OIDC signing key with {{ secret "..." }}.
      X_AUTHELIA_CONFIG_FILTERS: template
      # Secrets are read from files, never from env values or the config file.
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_encryption_key
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
    volumes:
      # configuration.yml, users_database.yml (not in git; see *.example.yml)
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/secrets:/secrets:ro
      # SQLite database and filesystem notifier output
      - ${APP_DATA_DIR}/data/db:/var/lib/authelia
