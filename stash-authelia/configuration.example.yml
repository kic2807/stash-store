# Authelia 4.39 configuration for stash-authelia.
#
# Copy to ~/umbrel/app-data/stash-authelia/data/config/configuration.yml and
# replace every example.com with your domain. Do not commit the real file.
#
# Secrets are NOT in this file. They are read from /secrets/* via the
# AUTHELIA_*_FILE variables in docker-compose.yml; the OIDC HMAC secret and
# signing key via the "secret" template function in the OIDC block below. Do
# not write template braces anywhere else, comments included: the template
# filter evaluates the whole file. Putting a secret here as well makes
# Authelia refuse to start.

theme: auto

server:
  address: 'tcp://:9091/'
  endpoints:
    authz:
      # Used by Caddy forward_auth (stash-caddy): /api/authz/forward-auth
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: info

totp:
  issuer: 'example.com'

webauthn:
  disable: false
  # Log in with a passkey instead of username + password.
  enable_passkey_login: true
  display_name: 'Stash'
  selection_criteria:
    # Store the credential on the device so it works as a passkey.
    discoverability: 'required'
    user_verification: 'required'
  # A passkey login counts as one factor, so every rule and OIDC client below
  # uses one_factor: one passkey login is all it takes. No two_factor rules.

authentication_backend:
  file:
    path: '/config/users_database.yml'
    password:
      algorithm: 'argon2'

# Users still need a password: for the first login and to register a passkey.
password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

access_control:
  # Anything not listed below is blocked.
  default_policy: 'deny'
  rules:
    # Private hosts behind Caddy forward_auth (stash-caddy Caddyfile). Caddy
    # already limits them to LAN and Tailscale; a passkey login is enough.
    # Opened as https://<name>.example.com:30443 (the port does not matter here).
    - domain:
        - 'films.example.com'     # Radarr
        - 'shows.example.com'     # Sonarr
        - 'search.example.com'    # Prowlarr
        - 'torrents.example.com'  # qBittorrent
      policy: 'one_factor'

    # Not a real host: Authelia turns off all second-factor methods (and with
    # them passkey/TOTP registration in Settings) unless at least one rule is
    # two_factor. This rule only keeps them on; nothing is served on it.
    - domain: 'mfa-enable.example.com'
      policy: 'two_factor'

    # Apps that use Authelia through OIDC (Immich, RomM, Jellyfin, Stump) do not
    # need rules here; their policy is set per client below.

session:
  # Memory provider (no Redis): sessions are lost when Authelia restarts.
  cookies:
    - name: 'authelia_session'
      domain: 'example.com'
      authelia_url: 'https://auth.example.com'
      # No default_redirection_url: after logging in at the portal directly you
      # stay on the portal (passkey settings) instead of being sent to an app
      # that may not be installed yet (502 from Caddy).
      inactivity: '1 day'
      expiration: '1 week'
      remember_me: '1 month'

regulation:
  max_retries: 5
  find_time: '10 minutes'
  ban_time: '1 hour'

storage:
  local:
    path: '/var/lib/authelia/db.sqlite3'

# No SMTP: one-time codes (identity verification for registering a passkey,
# password reset) are written to this file. Read it with:
#   sudo tail ~/umbrel/app-data/stash-authelia/data/db/notification.txt
notifier:
  filesystem:
    filename: '/var/lib/authelia/notification.txt'

# OpenID Connect provider. Commented out until you add the first app: Authelia
# refuses to start with OIDC enabled and no valid client. To enable it, remove
# the leading "# " from the identity_providers, oidc, jwks and clients lines
# and from ONE client block, and put that client's secret digest in.
# The two ..._TEMPLATE placeholders stand for the templates that read
# secrets/oidc_hmac_secret and secrets/oidc/private.pem; the README has the
# sed commands that put them in (template text cannot be written here, not even
# in a comment, because the template filter evaluates the whole file).
#
# Each client_secret is the digest of a random secret, never the secret itself:
#   sudo docker run --rm authelia/authelia:4.39.28 authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986
# "Random Password" goes into the app, "Digest" goes here.
#
# authorization_policy one_factor = a passkey alone is enough to log in.

