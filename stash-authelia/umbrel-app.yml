manifestVersion: 1
id: stash-authelia
category: networking
name: Authelia
version: "4.39.28-2"
tagline: Single sign-on with passkeys for all your apps
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/authelia.svg
description: >-
  Authelia is the login portal for every service: forward auth through Caddy (stash-caddy) for apps without SSO, and an OpenID Connect provider for Immich, RomM and Jellyfin.


  Authelia will not start until you create its configuration and secrets in the app data folder. Follow the README in the store repository.


  Use it at https://auth.<your domain> through Nginx Proxy Manager. Opening it from the Umbrel home screen shows an error page because the request does not come from your domain.
releaseNotes: >-
  Packaging only: the OIDC HMAC secret is no longer passed as an environment variable, which made Authelia require OIDC clients even with OIDC commented out. Documentation and example configuration now use Caddy forward_auth instead of Nginx Proxy Manager.

developer: Authelia
website: https://www.authelia.com
dependencies: []
repo: https://github.com/authelia/authelia
support: https://github.com/authelia/authelia/issues

port: 30091
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: kic2807
submission: https://github.com/kic2807/stash-store
