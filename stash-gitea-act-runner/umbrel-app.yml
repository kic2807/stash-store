manifestVersion: 1
id: stash-gitea-act-runner
category: developer
name: Gitea Runner
version: "5.0.0"
tagline: Gitea Actions runner with its own Docker-in-Docker daemon
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/gitea.svg
description: >-
  Background service with no web UI. Opening the app from the home screen does nothing; check the runner in Gitea under Settings -> Actions -> Runners.


  Before starting, create the .env file described in the store README (GITEA_INSTANCE_URL, GITEA_RUNNER_REGISTRATION_TOKEN) in the app data folder, then restart the app.


  Jobs run in a separate privileged Docker-in-Docker daemon. The host Docker socket is not used and the daemon is not reachable from other apps.
releaseNotes: ""

developer: Gitea
website: https://gitea.com/gitea/runner
dependencies: []
repo: https://gitea.com/gitea/runner
support: https://gitea.com/gitea/runner/issues

port: 30102
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

backupIgnore:
  - data/dind/*

submitter: kic2807
submission: https://github.com/kic2807/stash-store
