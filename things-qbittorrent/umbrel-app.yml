manifestVersion: 1
id: things-qbittorrent
category: networking
name: qBittorrent
version: "5.2.4-3"
tagline: qBittorrent behind a Tailscale exit node
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/qbittorrent.svg
description: >-
  qBittorrent. All torrent traffic leaves through a Tailscale exit node, given by its MagicDNS name. qBittorrent starts only once that exit node is online.


  Create ~/umbrel/app-data/things-qbittorrent/data/.env (TS_AUTHKEY, EXIT_NODE) BEFORE installing: qBittorrent only starts once the exit node is online, and an install whose first start fails is dropped. See the app README in the store repository.


  Torrents are bound to the tailscale0 interface on new installs, so they stop instead of leaking if the VPN drops. Keep Tools -> Options -> Advanced -> Network interface set to tailscale0.
releaseNotes: >-
  Exit node by MagicDNS name: set EXIT_NODE in .env (TS_EXTRA_ARGS is no longer used). qBittorrent now starts only after the exit node is online.

developer: qBittorrent / Tailscale
website: https://www.qbittorrent.org
dependencies: []
repo: https://github.com/kic2807/things-store
support: https://github.com/kic2807/things-store/issues

port: 30024
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

submitter: kic2807
submission: https://github.com/kic2807/things-store
