version: "3.7"

# All services share one network namespace owned by the tiny `net` container,
# like a Kubernetes pod. tailscale and qbittorrent join it, so either can be
# restarted without breaking the other (joining tailscale's own namespace left
# qBittorrent on a dead network whenever tailscale restarted).
# `net` owns the IP and published ports, so app_proxy targets it (umbrelOS
# resolves APP_HOST to that container's IP).
#
# All qBittorrent traffic leaves through the Tailscale exit node set in .env.
# The seeded qBittorrent config binds torrents to tailscale0, so if Tailscale
# is down torrents stop instead of using the home connection.

services:
  app_proxy:
    environment:
      APP_HOST: things-qbittorrent_net_1
      APP_PORT: 30024
      # Same as the official qBittorrent app: the WebUI API has its own login,
      # so API clients (mobile apps, browser extensions) can bypass Umbrel login.
      PROXY_AUTH_WHITELIST: "/api/*"

  net:
    image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    restart: on-failure
    ports:
      # BitTorrent listen port
      - "6881:6881/tcp"
      - "6881:6881/udp"

  tailscale:
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    network_mode: service:net
    restart: on-failure
    depends_on:
      - net
    # Kernel TUN mode is needed to route qBittorrent's traffic through the
    # exit node.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_HOSTNAME: umbrel-qbit-node
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    # TS_AUTHKEY and TS_EXTRA_ARGS (exit node) come from the app data .env file.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
    # Health status only (docker ps). Not used as a start condition: before .env
    # exists the node is not logged in, and waiting on it would fail the install.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls480@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    network_mode: service:net
    restart: on-failure
    depends_on:
      - net
      - tailscale
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul
      WEBUI_PORT: "30024"
      TORRENTING_PORT: "6881"
    volumes:
      - ${APP_DATA_DIR}/data/qbittorrent:/config
      # Same path as the official qBittorrent/Radarr/Sonarr/Jellyfin apps.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
