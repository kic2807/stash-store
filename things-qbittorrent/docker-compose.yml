version: "3.7"

# All services share one network namespace owned by the tiny `net` container,
# like a Kubernetes pod. tailscale and qbittorrent join it, so either can be
# restarted without breaking the other (joining tailscale's own namespace left
# qBittorrent on a dead network whenever tailscale restarted).
# `net` owns the IP and published ports, so app_proxy targets it (umbrelOS
# resolves APP_HOST to that container's IP).
#
# All qBittorrent traffic leaves through the Tailscale exit node set in .env
# (EXIT_NODE). qBittorrent starts only once that exit node is online, and the
# seeded qBittorrent config binds torrents to tailscale0, so if the exit node
# or Tailscale goes down torrents stop instead of using the home connection.

services:
  app_proxy:
    environment:
      APP_HOST: things-qbittorrent_net_1
      APP_PORT: 30024
      # Same as the official qBittorrent app: the WebUI API has its own login,
      # so API clients (mobile apps, browser extensions) can bypass Umbrel login.
      PROXY_AUTH_WHITELIST: "/api/*"

  net:
    image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    restart: on-failure
    ports:
      # BitTorrent listen port
      - "6881:6881/tcp"
      - "6881:6881/udp"

  tailscale:
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    network_mode: service:net
    restart: on-failure
    depends_on:
      - net
    # Kernel TUN mode is needed to route qBittorrent's traffic through the
    # exit node.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TS_HOSTNAME: umbrel-qbit-node
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      # containerboot runs `tailscale up` on every start, and `up` refuses to
      # run when persisted prefs (the exit node set below) are not repeated in
      # its flags. --reset clears them; the loop below sets the exit node again.
      # Set here so an old TS_EXTRA_ARGS in .env is ignored.
      TS_EXTRA_ARGS: --reset
    # TS_AUTHKEY and EXIT_NODE come from the app data .env file.
    env_file:
      - path: ${APP_DATA_DIR}/data/.env
        required: false
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
    # The exit node is given by MagicDNS name (EXIT_NODE), which only resolves
    # once tailscaled has its peer list, so it cannot go into `tailscale up`
    # (TS_EXTRA_ARGS). This wrapper starts the image's own containerboot and,
    # once the node is up (containerboot's /healthz), checks every 60 s whether
    # traffic really leaves through Mullvad (am.i.mullvad.net). If not, it runs
    # `tailscale set` again, which also looks the name up again (new IP).
    # `tailscale status` does not report Mullvad exit nodes (no ExitNodeStatus),
    # so Mullvad's own check is used instead.
    # SIGTERM is passed on to containerboot for a clean stop.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /usr/local/bin/containerboot &
        boot=$$!
        trap 'kill -TERM $$boot 2>/dev/null; wait $$boot' TERM INT
        if [ -n "$$EXIT_NODE" ]; then
          (
            until wget -q -O /dev/null http://127.0.0.1:9002/healthz; do sleep 2; done
            while true; do
              if ! wget -T 10 -qO- https://am.i.mullvad.net/json 2>/dev/null | grep -q '"mullvad_exit_ip":true'; then
                tailscale --socket=/tmp/tailscaled.sock set --exit-node="$$EXIT_NODE" --exit-node-allow-lan-access=true \
                  && echo "exit node set: $$EXIT_NODE"
                sleep 10
                continue
              fi
              sleep 60
            done
          ) &
        else
          echo "EXIT_NODE is not set in .env: no exit node, qBittorrent will not start"
        fi
        wait $$boot
    # Healthy only while traffic leaves through a Mullvad exit node, checked
    # with Mullvad's own service. qBittorrent waits for this before it starts.
    healthcheck:
      test: ["CMD-SHELL", "wget -T 10 -qO- https://am.i.mullvad.net/json | grep -q '\"mullvad_exit_ip\":true'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls480@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
    network_mode: service:net
    restart: on-failure
    depends_on:
      net:
        condition: service_started
      tailscale:
        condition: service_healthy
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Seoul
      WEBUI_PORT: "30024"
      TORRENTING_PORT: "6881"
    volumes:
      - ${APP_DATA_DIR}/data/qbittorrent:/config
      # Same path as the official qBittorrent/Radarr/Sonarr/Jellyfin apps.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
