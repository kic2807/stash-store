name: Check Authelia config

# Runs `authelia validate-config` on stash-authelia's configuration.example.yml
# with the image pinned in its docker-compose.yml and throwaway secrets.

on:
  push:
    branches: [main]
    paths: [stash-authelia/**]
  pull_request:
    paths: [stash-authelia/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          image=$(sed -n 's/^ *image: *//p' stash-authelia/docker-compose.yml | head -1)
          echo "image: $image"
          mkdir -p cfg secrets/oidc
          cp stash-authelia/configuration.example.yml cfg/configuration.yml
          cp stash-authelia/users_database.example.yml cfg/users_database.yml
          for f in jwt_secret session_secret storage_encryption_key oidc_hmac_secret; do
            openssl rand -hex 32 > "secrets/$f"
          done
          openssl genrsa -out secrets/oidc/private.pem 2048
          validate() {
            docker run --rm -e X_AUTHELIA_CONFIG_FILTERS=template \
              -e AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE=/secrets/jwt_secret \
              -e AUTHELIA_SESSION_SECRET_FILE=/secrets/session_secret \
              -e AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE=/secrets/storage_encryption_key \
              -v "$PWD/cfg:/config" -v "$PWD/secrets:/secrets:ro" "$image" \
              authelia validate-config --config /config/configuration.yml
          }
          echo "== as shipped (OIDC commented out)"
          validate

          echo "== OIDC on: identity_providers + Immich client uncommented, as in the README"
          digest=$(docker run --rm "$image" authelia crypto hash generate pbkdf2 --variant sha512 \
            --random --random.length 72 --random.charset rfc3986 | sed -n 's/^Digest: //p')
          awk '/^# identity_providers:/{on=1} /^#       # RomM/{on=0} on{sub(/^# ?/,"")} {print}' \
            stash-authelia/configuration.example.yml > cfg/configuration.yml
          sed -i 's#HMAC_SECRET_TEMPLATE#{{ secret "/secrets/oidc_hmac_secret" | msquote }}#' cfg/configuration.yml
          sed -i 's#SIGNING_KEY_TEMPLATE#{{ secret "/secrets/oidc/private.pem" | mindent 10 "|" | msquote }}#' cfg/configuration.yml
          sed -i "s#\$pbkdf2-sha512\$310000\$REPLACE_WITH_DIGEST#${digest}#" cfg/configuration.yml
          sed -n '/^identity_providers:/,/^#/p' cfg/configuration.yml | grep -v -E 'client_secret|BEGIN|END|^ {10}[A-Za-z0-9+/=]+$' | head -30
          validate
