name: Check Caddyfile

# Validates things-caddy's Caddyfile.example and the placeholder Caddyfile with
# the image pinned in things-caddy/docker-compose.yml.

on:
  push:
    branches: [main]
    paths: [things-caddy/**]
  pull_request:
    paths: [things-caddy/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          image=$(sed -n 's/^ *image: *//p' things-caddy/docker-compose.yml | head -1)
          echo "image: $image"
          # Also check the example with the commented-out private hosts enabled.
          sed -E 's/^\t# ([@\t}]|handle )/\t\1/' things-caddy/Caddyfile.example > /tmp/Caddyfile.private
          for f in things-caddy/Caddyfile.example /tmp/Caddyfile.private things-caddy/data/etc/Caddyfile; do
            echo "== $f"
            docker run --rm -v "$(realpath $f):/etc/caddy/Caddyfile:ro" "$image" caddy fmt --diff /etc/caddy/Caddyfile || true
            # Dummy values: validate loads the Cloudflare module (which checks the
            # token's format) but does not call the API.
            docker run --rm -v "$(realpath $f):/etc/caddy/Caddyfile:ro" \
              -e CLOUDFLARE_API_TOKEN=0000000000000000000000000000000000000000 \
              -e LAN_CIDR=192.168.1.0/24 \
              "$image" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
