manifestVersion: 1
id: stash-qbittorrent
category: networking
name: qBittorrent (VPN)
version: "5.2.4"
tagline: qBittorrent behind a Tailscale exit node
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/qbittorrent.svg
description: >-
  qBittorrent. All torrent traffic leaves through a Tailscale exit node.


  Before starting, create the .env file described in the store README (TS_AUTHKEY, TS_EXTRA_ARGS) in the app data folder, then restart the app.


  After the first start, open the app and bind it to the tailscale0 interface (see README) so torrents stop instead of leaking if the VPN drops.
releaseNotes: ""

developer: qBittorrent / Tailscale
website: https://www.qbittorrent.org
dependencies: []
repo: https://github.com/kic2807/stash-store
support: https://github.com/kic2807/stash-store/issues

port: 30024
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

permissions:
  - STORAGE_DOWNLOADS

submitter: kic2807
submission: https://github.com/kic2807/stash-store
